[project]
name = "marsgis"
version = "0.1.0"
description = "Mars exploration geospatial platform: ingestion, processing, tile serving and inspection of Mars rasters."
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary (hackathon prototype)" }
# Direct dependencies are pinned exactly. The full transitive lock lives in
# requirements.lock (generated with `uv pip compile`, see README).
dependencies = [
    "rasterio==1.5.2",        # bundles GDAL 3.12.2 + PROJ 9.8.1 (IAU_2015 CRS database included)
    "pyproj==3.8.0",          # bundles PROJ 9.8.1
    "numpy==2.3.5",
    "scipy==1.18.1",          # ndimage (windowed terrain operators), sparse.csgraph (Dijkstra)
    "scikit-image==0.26.0",   # graph.MCP_Geometric (independent minimum-cost-path engine)
    "morecantile==7.1.0",
    "rio-tiler==9.4.13",
    "titiler.core==2.4.0",
    "planetcantile==0.6.0",   # IAU TileMatrixSets for global planetary views
    "fastapi==0.162.4",
    "uvicorn[standard]==0.38.0",
    "pydantic-settings==2.12.0",
    "pystac==1.16.0",
    "pyyaml==6.0.3",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.1", "ruff==0.14.5"]

[project.scripts]
marsgis = "marsgis.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "/tmp/pytest_cache"  # /app is read-only for the non-root container user
markers = ["data: requires the processed sample dataset (run `marsgis build` first)"]

[tool.ruff]
line-length = 100
target-version = "py312"
cache-dir = "/tmp/ruff_cache"
